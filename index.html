<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Marketing Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body> 

<div class="container">
  <button onclick="toggleDarkMode()" id="darkBtn">
🌙 Dark Mode
</button>


<h1>🚀 AI Marketing Generator</h1>
<p class="subtitle">Create marketing content in seconds</p>

<input type="text" id="businessName"
placeholder="Business Name">
<select id="platform">
    <option>Instagram</option>
    <option>Facebook</option>
    <option>YouTube</option>
    <option>LinkedIn</option>
</select>

<select id="businessType">
<option>Restaurant</option>
<option>Clothing Store</option>
<option>Tech Startup</option>
<option>Beauty Salon</option>
<option>Online Shop</option>
</select>
<p id="count">0 Characters</p>

<textarea id="description"
placeholder="Describe your business"></textarea>

<button onclick="generateContent()">
Generate Content
</button>

<div id="result" class="result">
<h3>Generated Content</h3>

<div id="output"></div>

<button class="copy-btn"
onclick="copyContent()">
Copy Content
</button>
<button class="download-btn"
onclick="downloadContent()">
Download Content
</button>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
